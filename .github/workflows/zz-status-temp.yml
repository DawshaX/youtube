name: STATUS (مؤقت — يُحذف)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --silent
      - name: الحقيقة من القناة (OAuth) — كل فيديو وحالته + اللي فاضل على القناة
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          node - <<'EOF'
          import fs from 'node:fs';
          import { google } from 'googleapis';
          const auth = new google.auth.OAuth2(process.env.YOUTUBE_CLIENT_ID, process.env.YOUTUBE_CLIENT_SECRET);
          auth.setCredentials({ refresh_token: process.env.YOUTUBE_REFRESH_TOKEN });
          const yt = google.youtube({ version: 'v3', auth });

          const ch = await yt.channels.list({ part: ['snippet','contentDetails','statistics'], mine: true });
          const c = ch.data.items?.[0];
          console.log(`القناة: ${c?.snippet?.title} | مشتركين: ${c?.statistics?.subscriberCount} | فيديوهات: ${c?.statistics?.videoCount}`);
          const uploads = c?.contentDetails?.relatedPlaylists?.uploads;

          const items = [];
          let pageToken;
          do {
            const r = await yt.playlistItems.list({ part: ['snippet','contentDetails','status'], playlistId: uploads, maxResults: 50, pageToken });
            items.push(...(r.data.items || []));
            pageToken = r.data.nextPageToken;
          } while (pageToken);
          console.log(`\n=== اللي موجود فعلاً على القناة (${items.length}) ===`);
          for (const it of items) {
            console.log(`  ${it.contentDetails?.videoId} | ${it.status?.privacyStatus} | ${(it.snippet?.title||'').slice(0,50)}`);
          }

          console.log('\n=== السجلات في الريبو وحالتها ===');
          const records = JSON.parse(fs.readFileSync('data/saved_videos.json','utf-8'));
          for (const r of records) {
            const res = await yt.videos.list({ part: ['status','snippet'], id: [r.id] });
            const v = res.data.items?.[0];
            console.log(`  ${r.id} | ${v ? v.status.uploadStatus + '/' + v.status.privacyStatus : '❌ مش موجود (اتشال)'} | ${(r.title||'').slice(0,40)}`);
          }
          EOF
