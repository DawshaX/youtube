name: 🗓️ فحص جدول الـ١٢ (بلا نشر)
# إضافة فقط — يتأكد إن الأسبوع ١٢ نوع و٣ طويل كل يوم، والمكتبة والمراجع حية.
on:
  workflow_dispatch:
  push:
    paths:
      - "xtrendaw/noor_grid.py"
      - "xtrendaw/noor_look.py"
      - "xtrendaw/noor_sense.py"
      - "xtrendaw/noor_signs.py"
      - "xtrendaw/noor_ideas.py"
      - "xtrendaw/noor_variety.py"
      - "xtrendaw/noor_tree.py"
      - "tools/noor_tree_check.py"
      - "tools/noor_variety_check.py"
      - "tools/noor_grid_check.py"
      - "tools/noor_sense_check.py"
      - "content/idea_library.json"
permissions:
  contents: read
jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: فحص الجدول والمكتبة
        run: |
          python tools/noor_grid_check.py
          python tools/noor_sense_check.py
          python tools/noor_variety_check.py
          python tools/noor_tree_check.py
