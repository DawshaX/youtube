name: Radar + Analyzer (trend structure measurement — no copying)

# يقيس بنية الترند فقط (بند 0/5): سرعة المشاهد، بنية العناوين، الفئات.
# محتاج سر `YOUTUBE_API_KEY` (قراءة فقط) في أسرار المستودع.
# الحلقة المغذية نفسها: رادار (كل 6 ساعات) ← عين (بتشوف أقوى ترند جديد
# تلقائيًا) ← طابور المصنع. النشر يفضل معطل لموافقة صاحب القناة.
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */6 * * *'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install requests pillow numpy imageio-ffmpeg yt-dlp

      - name: Radar scan
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m xtrendaw.radar

      - name: Analyze
        run: python -m xtrendaw.analyzer

      - name: Eye مباشرة بعد الرادار
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: python -m xtrendaw.eye --auto --max 2

      - name: Commit measurement results
        run: |
          git config user.name "daousha-factory"
          git config user.email "daousha-factory@users.noreply.github.com"
          git add data/radar_snapshot.json data/patterns.json data/eye_topics.json data/eye_consumed.json data/eye/*/report.json data/eye/*/frames 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "radar: مسح بنية الترند + الأنماط المستخرجة"
            git push origin HEAD:${GITHUB_REF_NAME:-main}
          fi

  # العين: بعد كل مسح رادار، تشوف أقوى ترند جديد (≤60ث، ≥2M، مش متشاف)
  # وتكتب تقريرها + إصدارنا في الطابور. لا نشر إطلاقًا.
  eye:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install requests pillow numpy imageio-ffmpeg yt-dlp

      - name: Eye auto-watch the strongest new trend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          RESTCOUNTRIES: ${{ secrets.RESTCOUNTRIES }}
        run: |
          mkdir -p data/eye/diagnostics
          python -m xtrendaw.eye --auto --max 2 2>&1 | tee data/eye/diagnostics/run.log
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" != "0" ]; then
            echo "eye exited with code $EXIT" >> data/eye/diagnostics/run.log
            exit 1
          fi

      - name: Upload eye evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eye-evidence
          path: |
            data/eye/
            data/eye_topics.json
            data/eye_consumed.json

      - name: Commit eye reports (never the mp4)
        if: always()
        run: |
          git config user.name 'Daousha Eye [Bot]'
          git config user.email 'eye@daousha.internal'
          git add data/eye_topics.json data/eye_consumed.json 2>/dev/null || true
          for d in data/eye/*/; do
            [ -f "$d/report.json" ] && git add "$d/report.json"
            [ -d "$d/frames" ] && git add "$d/frames"
          done
          if [ -d data/eye/diagnostics ]; then
            git add data/eye/diagnostics 2>/dev/null || true
          fi
          if ! git diff --staged --quiet; then
            git commit -m 'evidence(eye): auto-watch after radar [skip ci]'
            git push origin HEAD:main
          fi
