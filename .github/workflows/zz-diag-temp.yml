name: DIAG (مؤقت — يُحذف بعد التشخيص)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q requests yt-dlp

      - name: بنية سر الكوكيز (أطوال وأشكال فقط — بدون أي قيم)
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          python - <<'PY'
          import base64, os, re, json
          v = os.environ.get("YOUTUBE_COOKIES_B64", "")
          out = {"set": bool(v.strip()), "len": len(v)}
          if v.strip():
              out["has_newlines"] = "\n" in v
              out["has_tabs"] = "\t" in v
              b64chars = bool(re.fullmatch(r"[A-Za-z0-9+/=\s]+", v)) and len(v.strip()) % 4 == 0
              out["looks_like_b64"] = b64chars
              dec = None
              if b64chars:
                  try:
                      dec = base64.b64decode(v.strip(), validate=False).decode("utf-8", "replace")
                      out["b64_decoded_len"] = len(dec)
                  except Exception as e:
                      out["b64_decode_error"] = type(e).__name__
              payload = dec if dec is not None else v
              lines = [l for l in payload.splitlines() if l.strip()]
              out["lines"] = len(lines)
              out["first_line_is_comment"] = lines[0].lstrip().startswith("#") if lines else None
              out["first_line_known_header"] = lines[0].strip()[:32] in (
                  "# Netscape HTTP Cookie File", "# HTTP Cookie File",
                  "# This is a generated file!") if lines else None
              out["first_line_httpOnly_prefix"] = lines[0].startswith("#HttpOnly_") if lines else None
              out["payload_starts_json"] = payload.lstrip()[:1] in ("{", "[")
              fields = [len(l.split("\t")) for l in lines[:5]]
              out["tab_fields_first5"] = fields
              ws = [len(l.split()) for l in lines[:5]]
              out["ws_fields_first5"] = ws
              data = [l for l in lines if not l.startswith("#")]
              if data:
                  f = data[0].split("\t")
                  out["first_data_line_tab_fields"] = len(f)
                  out["has_true_flags"] = any(x.strip() in ("TRUE", "FALSE") for x in f)
                  out["has_slash_path"] = any(x.startswith("/") for x in f)
                  out["has_numeric_expiry"] = any(x.isdigit() and len(x) >= 9 for x in f)
                  out["has_youtube_domain"] = any("you" in x for x in f)
          print(json.dumps(out, indent=2, ensure_ascii=False))
          PY

      - name: بروب الكوكيز مع yt-dlp (نفس ما تعمله العين) — بدون قيم
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          python - <<'PY'
          import base64, os, subprocess, sys, tempfile, json
          v = os.environ.get("YOUTUBE_COOKIES_B64", "").strip()
          res = {}
          try:
              raw = base64.b64decode(v)
          except Exception:
              raw = v.encode()
          fd, name = tempfile.mkstemp(suffix=".txt")
          os.write(fd, raw); os.close(fd)
          p = subprocess.run([sys.executable, "-m", "yt_dlp", "--cookies", name,
                              "--skip-download", "--simulate", "-v",
                              "https://www.youtube.com/watch?v=OP3a2qzW5Yk"],
                             capture_output=True, text=True, timeout=180)
          tail = (p.stderr or "")[-1200:]
          # نطبع فقط الأسطر اللي فيها كلمة cookies/Impersonate/HTTP Error بدون قيمة الكوكي
          keep = [l for l in tail.splitlines() if any(k in l for k in
                  ("cookies", "Cookie", "HTTP Error", "Impersonat", "Sign in", "ERROR"))]
          print("yt-dlp exit:", p.returncode)
          print("\n".join(keep[-12:]))
          PY

      - name: موديلات Groq المتاحة فعليًا + بروب شات
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, requests
          k = os.environ["GROQ_API_KEY"]
          H = {"Authorization": f"Bearer {k}"}
          try:
              r = requests.get("https://api.groq.com/openai/v1/models", headers=H, timeout=30)
              ids = [m["id"] for m in r.json().get("data", [])] if r.ok else []
              print("GROQ /models:", r.status_code, "| count:", len(ids))
              print("IDS:", json.dumps(sorted(ids)))
          except Exception as e:
              print("GROQ models error:", type(e).__name__, e)
          for model in ["llama-3.3-70b-versatile", "llama-3.1-8b-instant",
                        "openai/gpt-oss-120b", "openai/gpt-oss-20b",
                        "meta-llama/llama-4-maverick-17b-128e-instruct",
                        "qwen/qwen3-32b", "moonshotai/kimi-k2-instruct"]:
              try:
                  r = requests.post("https://api.groq.com/openai/v1/chat/completions", headers=H,
                                    json={"model": model, "max_tokens": 5,
                                          "messages": [{"role": "user", "content": "قول: تمام"}]},
                                    timeout=60)
                  print(f"  chat {model}: {r.status_code} {'' if r.ok else r.text[:180]}")
              except Exception as e:
                  print(f"  chat {model}: EXC {type(e).__name__}")
          PY

      - name: مسارات Gemini الفعلية + بروب شات
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, requests
          k = os.environ["GEMINI_API_KEY"]
          try:
              r = requests.get("https://generativelanguage.googleapis.com/v1beta/models",
                               params={"key": k}, timeout=30)
              if r.ok:
                  ids = [m["name"] for m in r.json().get("models", [])]
                  print("GEMINI v1beta/models:", r.status_code, "| count:", len(ids))
                  print("IDS:", json.dumps(sorted(ids)[:60]))
              else:
                  print("GEMINI /models:", r.status_code, r.text[:200])
          except Exception as e:
              print("GEMINI models error:", type(e).__name__, e)
          for model in ["gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-2.0-flash",
                        "gemini-flash-latest"]:
              # native
              try:
                  r = requests.post(
                      f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent",
                      headers={"x-goog-api-key": k, "Content-Type": "application/json"},
                      json={"contents": [{"parts": [{"text": "قول: تمام"}]}]}, timeout=60)
                  print(f"  native {model}: {r.status_code} {'' if r.ok else r.text[:180]}")
              except Exception as e:
                  print(f"  native {model}: EXC {type(e).__name__}")
              # openai-compat
              try:
                  r = requests.post(
                      "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions",
                      headers={"Authorization": f"Bearer {k}"},
                      json={"model": model, "messages": [{"role": "user", "content": "قول: تمام"}]},
                      timeout=60)
                  print(f"  compat {model}: {r.status_code} {'' if r.ok else r.text[:180]}")
              except Exception as e:
                  print(f"  compat {model}: EXC {type(e).__name__}")
          PY
