name: 🧪 نور — اختبار التصنيفات الجديدة (رندر بلا نشر)

# تشغيل يدوي فقط: يرندر التصنيفات الجديدة (أسماء الله · أذكار · كويز) على السيرفر
# للتأكد إن القوالب بتشتغل، وبيتحقق من بيانات الأدعية وقصص الأنبياء.
# ⚠️ صفر رفع وصفر نشر — ده اختبار جودة بس.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cats:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: تجهيز المكتبات
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow requests numpy edge-tts imageio-ffmpeg arabic-reshaper python-bidi
      - name: تشغيل اختبار التصنيفات
        env:
          NOOR_DRY: '1'
        run: python scripts/noor_cats_test.py
