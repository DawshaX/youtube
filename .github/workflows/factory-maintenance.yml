name: "🧹 صيانة المصنع (حذف حلقة يدويًا)"
# أمر يدوي فقط — مفيش جدولة. استخدمه لما حلقة تستاهل الحذف
# (مثال: حلقة مكررة من بق قديم). حراسات: المعرّف لازم يكون من حلاقتنا
# و`--yes` إلزامي، والحذف بيتسجل في state/ledger.json.
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "معرّف الفيديو (مثال: gEcssSpLwD0)"
        required: true
      confirm:
        description: "اكتب: حذف"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'حذف' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet requests
      - name: احذف الحلقة (بحراسات)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/video_delete.py --id "${{ inputs.video_id }}" --yes
