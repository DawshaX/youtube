name: CosmicTube Autonomous Auto-Pilot

on:
  schedule:
    # Run every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Cosmic Auto-Pilot Cycle
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          node -e "
          import('./server/autoPilot.js').then(async (m) => {
            console.log('Starting autonomous scheduled cycle on GitHub Cloud...');
            await m.runAutoPilotCycle();
            console.log('Cycle completed successfully.');
            process.exit(0);
          }).catch(err => {
            console.error('Auto-pilot failed:', err);
            process.exit(1);
          });
          "
