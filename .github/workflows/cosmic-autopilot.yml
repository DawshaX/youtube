name: CosmicTube Autonomous Auto-Pilot 24/7
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cosmictube-channel-publisher
  cancel-in-progress: false
jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0a6ed-youtube
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install pillow numpy requests edge-tts imageio-ffmpeg arabic-reshaper python-bidi
      - run: npm ci
      - name: Produce and publish one real video
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/run-autopilot.js
      - name: Persist confirmed upload history
        if: always()
        run: |
          git config user.name 'CosmicTube AutoPilot [Bot]'
          git config user.email 'bot@cosmictube.internal'
          git add data/saved_videos.json
          if ! git diff --staged --quiet; then
            git commit -m 'chore: record confirmed YouTube upload [skip ci]'
            git push origin HEAD:arena/01a0a6ed-youtube
          fi
      - name: Preserve upload history if pushing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upload-history
          path: data/saved_videos.json
