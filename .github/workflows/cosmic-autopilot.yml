name: CosmicTube Autonomous Auto-Pilot 24/7
# موافقة صاحب القناة مثبتة؛ النشر ساعي ويفشل بأمان قبل الرفع.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write   # للتسلسل: الدورة تشغّل اللي بعدها فورًا بعد نشر ناجح
concurrency:
  group: cosmictube-channel-publisher
  cancel-in-progress: false
jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      # Scheduled runs fire on the default branch, so this always renders and
      # publishes the code that is actually merged — not a stale PR branch.
      - uses: actions/checkout@v4

      # Fail in seconds instead of after a full toolchain install when the
      # channel credentials are not configured.
      - name: Check channel credentials
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          missing=""
          [ -z "$YOUTUBE_CLIENT_ID" ] && missing="$missing YOUTUBE_CLIENT_ID"
          [ -z "$YOUTUBE_CLIENT_SECRET" ] && missing="$missing YOUTUBE_CLIENT_SECRET"
          [ -z "$YOUTUBE_REFRESH_TOKEN" ] && missing="$missing YOUTUBE_REFRESH_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Nothing was produced and nothing was published."
            exit 1
          fi
          echo "Channel credentials present."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install pillow numpy requests edge-tts imageio-ffmpeg arabic-reshaper python-bidi
      - run: npm ci
      - name: Produce and publish one real video
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # مشروع Google Cloud تاني (اختياري): حصة يومية مستقلة = ضعف النشر.
          # لو الأسرار دي مش موجودة، المصنع بيكمّل بالمشروع الأول عادي.
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          XT_NET_FOOTAGE: '1'
          XT_SCENE_CUT: '2.0'
          # سقف الحصة اليومية ليوتيوب (10000 وحدة ÷ 1600 للرفعة = 6).
          # الدورة الزيادة بتتخطى النشر بهدوء وبتكمّل بعد تجديد الحصة.
          XT_MAX_UPLOADS_PER_DAY: '6'
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: node scripts/run-autopilot.js
      - name: Verify the published link resolves on YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          # ملف اعتماد مؤقت فقط، ويُمسح حتى لو فشل التحقق.
          trap 'rm -f data/config.json' EXIT
          umask 077
          node -e "const fs=require('fs');fs.writeFileSync('data/config.json',JSON.stringify({apiKey:process.env.YOUTUBE_API_KEY||'',clientId:process.env.YOUTUBE_CLIENT_ID,clientSecret:process.env.YOUTUBE_CLIENT_SECRET,tokens:{refresh_token:process.env.YOUTUBE_REFRESH_TOKEN},connected:true,mode:'live'}),{mode:0o600})"
          node scripts/verify-uploads.js
      - name: Persist confirmed upload history
        id: persist
        if: always()
        run: |
          BRANCH="${{ github.ref_name }}"
          git config user.name 'CosmicTube AutoPilot [Bot]'
          git config user.email 'bot@cosmictube.internal'
          git add data/saved_videos.json
          if [ -f data/production_log.json ]; then
            git add data/production_log.json
          fi
          if ! git diff --staged --quiet; then
            echo "published=1" >> "$GITHUB_OUTPUT"
            git commit -m 'chore: record confirmed YouTube upload [skip ci]'
          # دفع آمن من سباق: بوتات كتير بتدفع على main (العين/البايلوت/المصنع/الوكيل).
          # الدرس (تشغيل 2026-09-19): pilot-render فشل كله لأن الدفع اترفض:
          #   ! [rejected] HEAD -> main (fetch first)
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$BRANCH" >/dev/null 2>&1 || true
            if git push origin "HEAD:$BRANCH"; then break; fi
            echo "دفع محاولة $attempt فشلت (الريموت اتغير) — إعادة محاولة بعد 5 ثوانٍ…"
            sleep 5
          done
          fi
      # النشر المتسلسل الفوري: أول ما فيديو ينشر فعلًا، الدورة اللي بعدها تبدأ
      # حالًا — مفيش انتظار للساعة. لو مفيش نشر (السقف اتستهلك أو فشل)، التسلسل
      # بيوقف لوحده، والجدولة الساعية بتكمّل من بكرة.
      - name: Chain the next cycle now (publish as soon as one is ready)
        if: steps.persist.outputs.published == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "✓ نشر جديد اتسجل — بشغّل الدورة اللي بعدها فورًا."
          gh workflow run cosmic-autopilot.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Preserve upload history if pushing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upload-history
          path: data/saved_videos.json
