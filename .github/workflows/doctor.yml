name: Doctor — فحص صحة الاعتمادات
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests yt-dlp
      - name: فحص حي
        id: doctor
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: python -m xtrendaw.doctor --json | tee doctor-report.json
      - name: افتح أو حدّث بلاغ الصحة
        if: steps.doctor.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(cat doctor-report.json)"
          issue="$(gh issue list --state open --search '[health] in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then gh issue comment "$issue" --body-file doctor-report.json
          else gh issue create --title '[health] اعتمادات المصنع تحتاج تدخلاً' --body-file doctor-report.json; fi
          exit 1
