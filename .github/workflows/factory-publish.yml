name: 🏭 مصنع دۅۄشے — النشر الساعي (فوري أول ما الحلقة تجهز)

# المصنع جديد (xtrendaw) — مش الوكيل القديم:
#   python -m xtrendaw.run_cycle --next
# الدورة الواحدة بتعمل: تخطيط ذكي (بلا تكرار) → جمع ميديا حقيقية من كل
# المفاتيح (بيكسلز/بيكساباي/ناسا/كومنز/أرشيف الإنترنت/أوبنفيرس/فري ساوند)
# → صوت عربي بتوقيت كلمات → مونتاج 9:16 → بوابة جودة → تخزين في الـvault
# → نشر فوري + طابور الكوتة.
#
# حماية الكوتة: يوتيوب 10,000 وحدة/يوم والرفعة 1,600 → 6 رفعات.
# الرقم ده متحوط في `settings.DAILY_CAP` + `state/published.json` (على git)،
# فالدورات الزيادة بتخزّن في الـvault وما بتحاولش ترفع — صفر أخطاء حصة.
on:
  schedule:
    - cron: '11 * * * *'   # كل ساعة — حلقة واحدة
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'رندر بلا نشر (معاينة فقط)'
        type: boolean
        default: false
      force:
        description: 'تجاهل حماية الساعة الواحدة'
        type: boolean
        default: false
      mode:
        description: 'خط الإنتاج: تلقائي (العين → ترند → معرفة، والمخ يقرر) أو نور (قرآن/ذكر/حديث)'
        type: choice
        options:
          - auto
          - deen
        default: auto

permissions:
  contents: write
  actions: write

concurrency:
  group: daousha-factory-publish   # دورة واحدة في الوقت — مفيش تصادم
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    # الدورة + نوم النبضة (45 دقيقة كحد أقصى) — لازم أكبر من الاتنين مع بعض
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render + media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --quiet pillow numpy requests edge-tts \
            imageio-ffmpeg arabic-reshaper python-bidi pyyaml

      - name: فحص حارس القانون (FACTORY_RULES) قبل أي إنتاج
        run: python scripts/verify_factory.py

      - name: سجّل حالة ما قبل الدورة (لحارس الكوتة والتقرير)
        id: before
        run: |
          python - <<'EOF'
          import json, pathlib
          p = pathlib.Path("state/published.json")
          try:
              d = json.loads(p.read_text(encoding="utf-8")) if p.exists() else []
          except Exception:
              d = []
          d = d if isinstance(d, list) else []
          pathlib.Path("/tmp/published_before.json").write_text(json.dumps(d))
          plan = pathlib.Path("state/produced.json")
          try:
              eps = json.loads(plan.read_text(encoding="utf-8")).get("episodes", {})
          except Exception:
              eps = {}
          print(f"قبل الدورة: {len(d)} نشرة في آخر 24 ساعة · {len(eps)} حلقة في الذاكرة")
          print(f"count={len(d)}" , file=open("/tmp/before_count.txt","w"))
          EOF

      - name: 🏭 دورة إنتاج ونشر كاملة (المصنع الجديد)
        id: cycle
        env:
          # ── النشر ──────────────────────────────────────────────
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          # ── الذكاء والرادار ────────────────────────────────────
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          # ── الميديا والمؤثرات (كل مزوّد بمفتاحه) ────────────────
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PEXELS: ${{ secrets.PEXELS }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          NASA: ${{ secrets.NASA }}
          OPENVERSE_API_KEY: ${{ secrets.OPENVERSE_API_KEY }}
          OPENVERSE: ${{ secrets.OPENVERSE }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # ── الـvault على GitHub (تخزين الحلقات) ─────────────────
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── مفاتيح المصنع ──────────────────────────────────────
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          RESTCOUNTRIES_API_KEY: ${{ secrets.RESTCOUNTRIES_API_KEY }}
          RESTCOUNTRIES: ${{ secrets.RESTCOUNTRIES }}
          XT_MODE: ${{ inputs.mode == 'deen' && 'deen' || '' }}   # auto: المخ يقرر
          XT_STATIC_VAULT: '0'            # ممنوع استخدام صور التجربة الثابتة
          XT_YT: '1'                      # نشر يوتيوب مفتوح
          XT_NET_FOOTAGE: '1'             # لقطات حقيقية من المصادر الشبكية
          XT_PUBLISH_HOURS: 'all'         # يفرج فورًا — مش مستني موعد ذروة
          XT_DAILY_CAP: '6'               # سقف كوتة يوتيوب (10,000 ÷ 1,600)
          XT_YT_QURAN: 'auto'             # قراء معتمدين فقط (حماية حقوق)
          XT_SCENE_CUT: '2.0'
        run: |
          set -o pipefail
          # حلقة المصنع الكاملة لدورة واحدة:
          #   رادار → عين (تشوف فيديو ترند حقيقي كاملًا) → اختيار الحلقة
          #   → ميديا حيّة من الـAPIs → صوت/دبلجة → مونتاج → بوابة جودة
          #   → نشر + دبلجة لغات + حفظ الذاكرة.
          ARGS="--once"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --no-upload"
          echo "▶ python scripts/factory_loop.py $ARGS"
          python scripts/factory_loop.py $ARGS 2>&1 | tee /tmp/cycle.log
          RC=${PIPESTATUS[0]}
          echo "rc=$RC"
          exit $RC

      - name: تقرير الدورة (state/last_cycle.json)
        if: always()
        run: |
          python - <<'EOF'
          import json, pathlib, time
          def rd(p, d):
              try:
                  return json.loads(pathlib.Path(p).read_text(encoding="utf-8"))
              except Exception:
                  return d
          before = rd("/tmp/published_before.json", [])
          after = rd("state/published.json", [])
          produced = rd("state/produced.json", {}).get("episodes", {})
          log = pathlib.Path("/tmp/cycle.log")
          tail = log.read_text(encoding="utf-8", errors="replace")[-4000:] if log.exists() else ""
          rep = {
              "at": time.strftime("%Y-%m-%d %H:%M UTC", time.gmtime()),
              "published_before": len(before) if isinstance(before, list) else 0,
              "published_after": len(after) if isinstance(after, list) else 0,
              "published_this_cycle": (len(after) - len(before))
                  if isinstance(after, list) and isinstance(before, list) else None,
              "episodes_in_memory": len(produced),
              "last_lines": tail[-1500:],
          }
          pathlib.Path("state").mkdir(exist_ok=True)
          # ⚠️ المستودع عام: أي سطر لوج بيتحفظ لازم يتشطّف من المفاتيح
          import re as _re
          rep["last_lines"] = _re.sub(
              r"(AIza[A-Za-z0-9_-]{20,}|gh[pous]_[A-Za-z0-9]{20,}"
              r"|GOCSPX-[A-Za-z0-9_-]{10,}|1//[0-9A-Za-z_-]{20,})",
              "***REDACTED***", str(rep.get("last_lines") or ""))
          pathlib.Path("state/last_cycle.json").write_text(
              json.dumps(rep, ensure_ascii=False, indent=1), encoding="utf-8")
          print(json.dumps({k: v for k, v in rep.items() if k != "last_lines"},
                           ensure_ascii=False, indent=1))
          EOF

      - name: خزّن ذاكرة المصنع على git (من غيرها كل دورة بتبدأ من الصفر)
        id: persist
        if: always()
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"
          git config user.name 'مصنع دۅۄشے [Bot]'
          git config user.email 'factory@daousha.internal'
          # كل ملف لوحده ولو موجود: `git add` بيفشل ويسيب الفهرس فاضي
          # لو حطينا مسار مش موجود معاهم (اتعلمت من دورة 04:47).
          for f in data/factory_status.json state/yt_pending.json \
                   state/produced.json state/ledger.json \
                   state/published.json state/last_publish.json \
                   state/yt_recent.json state/media_used.json \
                   state/reciter_proven.json state/reciter_badlist.json \
                   state/last_cycle.json state/latest_sheet.jpg \
                   data/eye_topics.json data/eye_consumed.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          if git diff --staged --quiet; then
            echo "مفيش تغيير في الذاكرة"
            exit 0
          fi
          git commit -m "factory(state): ذاكرة المصنع بعد الدورة [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$BRANCH" >/dev/null 2>&1 || true
            if git push origin "HEAD:$BRANCH"; then echo "✓ الذاكرة اتحفظت"; break; fi
            echo "دفع محاولة $attempt فشلت — إعادة بعد 5 ثوانٍ…"
            sleep 5
          done

      # ⏱️ نبضة الساعة: جدولة GitHub نفسها مش موثوقة على المستودعات العامة
      # (بق حقيقي 2026-09-20: الدورة الساعية اتنفذت 06:12 و12:18 بس في يوم
      #  كامل، والحارس نفسه اتأخر 4 ساعات). الحل: الدورة تشغّل اللي بعدها.
      - name: ⏱️ نبضة الساعة — شغّل الدورة الجاية (نشر ساعي مضمون)
        if: always() && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # كمّل ساعة كاملة من بداية الدورة (بس ما ننامش أكتر من 45 دقيقة)
          START=$(date -d "${{ github.run_started_at }}" +%s)
          NOW=$(date +%s)
          SLEEP=$(( 3600 - (NOW - START) ))
          [ "$SLEEP" -gt 2700 ] && SLEEP=2700
          [ "$SLEEP" -lt 0 ] && SLEEP=0
          echo "⏱️ الدورة خدت $(( NOW - START )) ثانية — هستنى ${SLEEP}ث وبعدين أشغّل الجاية"
          sleep "$SLEEP"
          if [ "$SLEEP" -ge 2700 ]; then
            echo "⚠️ الدورة خدت أكتر من 45 دقيقة — الدورة الجاية فورًا"
          fi
          gh workflow run factory-publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f dry_run=false -f force=false -f mode=auto
          echo "✓ الدورة الجاية اتبعتت (الساعية مضمونة بلا جدولة)"

      - name: ملخص الدورة + الدليل البصري
        if: always()
        run: |
          {
            echo "### 🏭 دورة المصنع"
            echo '```'
            [ -f state/last_cycle.json ] && cat state/last_cycle.json
            echo '```'
            echo "### آخر سطور اللوج"
            echo '```'
            tail -n 30 /tmp/cycle.log 2>/dev/null || echo "(مفيش لوج)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: ارفع الدليل (ورقة الإطارات + تقرير الدورة)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-cycle
          path: |
            state/latest_sheet.jpg
            state/last_cycle.json
            /tmp/cycle.log
          if-no-files-found: ignore
