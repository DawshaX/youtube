name: Pilot Episode Render (review only — never publishes)

# حلقة تجريبية للمراجعة قبل الموافقة على النشر.
# - بلا أي أسرار: مايلمسش يوتيوب/فيسبوك/تيليجرام خالص.
# - بيرفع ملف الفيديو + الغلاف + التقرير كـ artifact للمراجعة اليدوية.
# - النشر الحقيقي موقوف لحد ما صاحب القناة يشوف الحلقة ويوافق.
on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: 'Topic id from content/topics_daousha.json or content/topics.json (default: next in queue)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  render-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install pillow numpy requests edge-tts imageio-ffmpeg arabic-reshaper python-bidi

      - name: Render the pilot episode
        env:
          PILOT_TOPIC_ID: ${{ inputs.topic_id }}
        run: |
          node - <<'EOF'
          import fs from 'node:fs';
          const { listProductionQueue, startProduceJob, getJobStatus } =
            await import('./server/videoFactoryBridge.js');
          const wanted = (process.env.PILOT_TOPIC_ID || '').trim();
          let topic;
          if (wanted) {
            topic = listProductionQueue().find(t => t.id === wanted);
            if (!topic) throw new Error(`Topic ${wanted} is not producible in the catalog`);
          } else {
            topic = listProductionQueue()[0];
          }
          if (!topic) throw new Error('The catalog holds no producible topic');
          console.log(`Pilot topic: [${topic.source}] ${topic.id} — ${topic.title_ar}`);
          const job = await startProduceJob(topic);
          const deadline = Date.now() + 22 * 60 * 1000;
          while (Date.now() < deadline) {
            const st = getJobStatus(job.jobId);
            if (st.status === 'error') throw new Error(st.error);
            if (st.status === 'completed') {
              const out = st.outputVideo;
              console.log(JSON.stringify({
                video: out.filePath,
                cover: out.coverPath,
                audioSources: out.audioSources,
                report: out.report
              }, null, 2));
              fs.writeFileSync('data/pilot_report.json', JSON.stringify(out.report, null, 2));
              process.exit(0);
            }
            await new Promise(r => setTimeout(r, 3000));
          }
          throw new Error('Pilot render timed out');
          EOF

      - name: Upload pilot artifacts for review
        uses: actions/upload-artifact@v4
        with:
          name: pilot-episode
          path: |
            content/vids/*.mp4
            content/vids/*-cover.png
            data/pilot_report.json
          if-no-files-found: error
