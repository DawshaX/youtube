name: Pilot Episode Render (review only — never publishes)

# حلقة تجريبية للمراجعة قبل الموافقة على النشر.
# - بلا أي أسرار: ما يلمسش يوتيوب/فيسبوك/تيليجرام خالص.
# - بيرفع الفيديو + الغلاف + التقرير + الأدلة (plan.json · caps.ass ·
#   قائمة الأصوات العربية) كـ artifacts للمراجعة اليدوية.
# - النشر الحقيقي موقوف لحد ما صاحب القناة يشوف الحلقة ويوافق.
on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: 'Topic id from content/topics_daousha.json or content/topics.json (default: next in queue)'
        required: false
        default: ''
  # مشغّلات مؤقتة عشان الساندبوكس ما يقدرش يعمل dispatch بنفسه (مفيش actions:write):
  # أول تعديل للملف ده على الرئيسي يشغّل الدورة مرة، وكرُون لمرة واحدة احتياطي.
  # تتشال في الكوميت اللي بعده مباشرة.
  push:
    branches: [main]
    paths: ['.github/workflows/pilot-render.yml']
  schedule:
    - cron: '10 23 16 9 *'

permissions:
  contents: write   # عشان خطوة الأدلة تقدر تعمل كوميت بالخطة الحقيقية في المستودع

jobs:
  render-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install pillow numpy requests edge-tts imageio-ffmpeg arabic-reshaper python-bidi

      - name: Print available edge-tts Arabic voices
        run: python scripts/list_ar_voices.py

      - name: Render the pilot episode
        env:
          PILOT_TOPIC_ID: ${{ inputs.topic_id }}
        run: |
          node - <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          const { listProductionQueue, startProduceJob, getJobStatus } =
            await import('./server/videoFactoryBridge.js');
          const wanted = (process.env.PILOT_TOPIC_ID || '').trim();
          let topic;
          if (wanted) {
            topic = listProductionQueue().find(t => t.id === wanted);
            if (!topic) throw new Error(`Topic ${wanted} is not producible in the catalog`);
          } else {
            topic = listProductionQueue()[0];
          }
          if (!topic) throw new Error('The catalog holds no producible topic');
          console.log(`Pilot topic: [${topic.source}] ${topic.id} — ${topic.title_ar}`);
          const job = await startProduceJob(topic);
          const deadline = Date.now() + 22 * 60 * 1000;
          while (Date.now() < deadline) {
            const st = getJobStatus(job.jobId);
            if (st.status === 'error') throw new Error(st.error);
            if (st.status === 'completed') {
              const out = st.outputVideo;
              fs.mkdirSync('data/pilot_evidence', { recursive: true });
              fs.writeFileSync('data/pilot_report.json', JSON.stringify(out.report, null, 2));
              // الأدلة: الخطة الصوتية الحقيقية + الكابتشنز الفعلية
              const workdirs = fs.readdirSync('/tmp').filter(f => f.startsWith('work_job'));
              for (const wd of workdirs) {
                const plan = `/tmp/${wd}/tts/plan.json`;
                const ass = `/tmp/${wd}/caps.ass`;
                if (fs.existsSync(plan)) fs.copyFileSync(plan, 'data/pilot_evidence/plan.json');
                if (fs.existsSync(ass)) fs.copyFileSync(ass, 'data/pilot_evidence/caps.ass');
              }
              console.log(JSON.stringify({
                video: out.filePath,
                cover: out.coverPath,
                audioSources: out.audioSources,
                scenes: out.report?.scenes,
                validate: out.report?.validate
              }, null, 2));
              process.exit(0);
            }
            await new Promise(r => setTimeout(r, 3000));
          }
          throw new Error('Pilot render timed out');
          EOF

      - name: Upload pilot artifacts for review
        uses: actions/upload-artifact@v4
        with:
          name: pilot-episode
          path: |
            content/vids/*.mp4
            data/pilot_report.json
            data/pilot_evidence/plan.json
            data/pilot_evidence/caps.ass
            state/ar_voices.txt
          if-no-files-found: error

      - name: Commit real evidence back to the repo
        run: |
          git config user.name "daousha-factory"
          git config user.email "daousha-factory@users.noreply.github.com"
          mkdir -p data/pilot_evidence
          git add data/pilot_report.json data/pilot_evidence/plan.json \
                  data/pilot_evidence/caps.ass
          git add -f state/ar_voices.txt
          if git diff --cached --quiet; then
            echo "no evidence to commit"
          else
            git commit -m "evidence(pilot): plan.json + caps.ass + ar voices from the REAL Actions render"
            git push origin HEAD:${GITHUB_REF_NAME:-main}
          fi
