name: quota-probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: قياس عدد الرفعات الحقيقي في اليوم
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests
          ffmpeg -f lavfi -i color=c=black:s=640x360:d=2 -f lavfi -i anullsrc -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/t.mp4 -y 2>/dev/null
          python - <<'PY'
          import os, json, urllib.parse, urllib.request, requests, time
          cid=os.environ["YOUTUBE_CLIENT_ID"]; csec=os.environ["YOUTUBE_CLIENT_SECRET"]; rt=os.environ["YOUTUBE_REFRESH_TOKEN"]
          d=urllib.parse.urlencode({"client_id":cid,"client_secret":csec,"refresh_token":rt,"grant_type":"refresh_token"}).encode()
          tok=json.loads(urllib.request.urlopen(urllib.request.Request("https://oauth2.googleapis.com/token",data=d),timeout=30).read())["access_token"]
          size=os.path.getsize("/tmp/t.mp4"); ok=0; stop=None
          for i in range(1,9):
              meta={"snippet":{"title":f"اختبار حصة {i} — يتشال","description":"test","categoryId":"27"},
                    "status":{"privacyStatus":"private","selfDeclaredMadeForKids":False}}
              init=requests.post("https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status",
                  headers={"Authorization":f"Bearer {tok}","Content-Type":"application/json",
                           "X-Upload-Content-Type":"video/mp4","X-Upload-Content-Length":str(size)},
                  json=meta, timeout=60)
              if init.status_code!=200:
                  e=init.json().get("error",{})
                  print(f"رفعة {i}: رفض ({init.status_code}) السبب: {(e.get('errors') or [{}])[0].get('reason')}")
                  stop=i; break
              up=requests.put(init.headers["Location"],headers={"Content-Length":str(size)},data=open("/tmp/t.mp4","rb"),timeout=180)
              if up.status_code in (200,201):
                  ok+=1; print(f"رفعة {i}: ✅ نجحت")
              else:
                  e=up.json().get("error",{}) if str(up.headers.get("content-type","")).startswith("application/json") else {}
                  print(f"رفعة {i}: ✗ فشلت ({up.status_code}) {(e.get('errors') or [{}])[0].get('reason')}")
                  stop=i; break
              time.sleep(2)
          print(f"النتيجة: {ok} رفعة إضافية نجحت" + (f" · وقف عند رقم {stop}" if stop else " (لسه فيه حصة)"))
          PY
