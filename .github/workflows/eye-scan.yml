name: Eye Scan (watch a real viral video — analyze, never publish)
# العين: تنزيل فيديو ترند حقيقي → تسميات بتوقيتات حقيقية → مشاهد/ألوان/حركة/صوت
# → وكيل LLM يحلل الـ DNA ويكتب إصدارنا الأصلي → طابور المصنع (data/eye_topics.json).
# لا نشر إطلاقًا — مخرجات قابلة للتدقيق: report.json + frames + موضوع الطابور.
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video ID (اتركه فاضي = اختيار تلقائي من أعلى ترند الرادار)"
        required: false
      max_videos:
        description: "كم فيديو نشوف في الوضع التلقائي (افتراضي 2)"
        required: false
  # تشغيل بتاج: eye/<VIDEO_ID> = شوف الفيديو ده · eye/auto = اختيار تلقائي
  push:
    tags:
      - 'eye/*'
permissions:
  contents: write
concurrency:
  group: daousha-eye
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install requests pillow numpy imageio-ffmpeg yt-dlp

      - name: Watch + analyze + write our version
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          VID="${{ github.event.inputs.video_id }}"
          # تاج eye/<VIDEO_ID> (أو eye/auto)
          case "${GITHUB_REF:-}" in
            refs/tags/eye/*)
              T="${GITHUB_REF#refs/tags/eye/}"
              if [ "$T" != "auto" ] && [ -z "$VID" ]; then VID="$T"; fi
              ;;
          esac
          # كل مخرجات الخطأ تتحفظ في ملف تشخيص (أمان ضد أي انهيار)
          mkdir -p data/eye/diagnostics
          if [ -n "$VID" ]; then
            python -m xtrendaw.eye --video-id "$VID" 2>&1 | tee data/eye/diagnostics/run.log
            EXIT=${PIPESTATUS[0]}
          else
            MAX="${{ github.event.inputs.max_videos || '2' }}"
            python -m xtrendaw.eye --auto --max "$MAX" 2>&1 | tee data/eye/diagnostics/run.log
            EXIT=${PIPESTATUS[0]}
          fi
          if [ "$EXIT" != "0" ]; then
            echo "eye exited with code $EXIT" >> data/eye/diagnostics/run.log
            exit 1
          fi

      - name: Upload evidence (report + real keyframes + produced topics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eye-evidence
          path: |
            data/eye/
            data/eye_topics.json
            data/eye_consumed.json

      - name: Commit the eye queue (reports + frames only — never the mp4)
        if: always()
        run: |
          git config user.name 'Daousha Eye [Bot]'
          git config user.email 'eye@daousha.internal'
          git add data/eye_topics.json data/eye_consumed.json 2>/dev/null || true
          for d in data/eye/*/; do
            [ -f "$d/report.json" ] && git add "$d/report.json"
            [ -d "$d/frames" ] && git add "$d/frames"
          done
          # ملف التشخيص (لو فشل التشغيل) — بيتحفظ في الجيت عشان نقراه
          if [ -d data/eye/diagnostics ]; then
            git add data/eye/diagnostics 2>/dev/null || true
          fi
          if ! git diff --staged --quiet; then
            git commit -m 'evidence(eye): watched reports + topics [skip ci]'
            git push origin HEAD:main
          fi
          # ملخص التشغيل في الصفحة
          {
            echo "### Result of the Eye scan"
            echo '```'
            for f in data/eye/*/report.json; do
              [ -f "$f" ] && echo "REPORT: $f"
            done
            for f in data/eye/diagnostics/*.txt; do
              [ -f "$f" ] && { echo "ERROR FILE: $f"; cat "$f"; }
            done
            [ -f data/eye_topics.json ] && echo "TOPICS: $(cat data/eye_topics.json | head -c 400)"
          } >> "$GITHUB_STEP_SUMMARY" || true
