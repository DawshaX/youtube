name: اختبارات المصنع
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install requests numpy pillow edge-tts imageio-ffmpeg arabic-reshaper python-bidi
      - run: npm ci
      - name: Python — العين والصوت والدكتور والعالم
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tests/test_tts_word_timing.py
      - name: فحص أسماء غير معرّفة (يمنع NameError في الإنتاج)
        run: |
          python -m pip install -q pyflakes
          # الدرس: تعديل شال تعريف دالة، والاختبارات عدّت، والعين وقعت في الإنتاج.
          if python -m pyflakes xtrendaw tests | grep -E "undefined name|redefinition"; then
            echo "::error::فيه أسماء غير معرّفة — التزم بالإصلاح قبل الدمج"; exit 1
          fi
          echo "✓ مفيش أسماء غير معرّفة"

      - name: Node — النشر
        run: node --test tests/publishing.test.js
