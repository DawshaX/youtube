name: token-detail
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: تفاصيل أخطاء التوكنات + كل القنوات
        env:
          C1: ${{ secrets.YOUTUBE_CLIENT_ID }}
          S1: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          R1: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          C2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          S2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          R2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          C3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
          S3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
          R3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
        run: |
          pip install -q requests
          python - <<'PYEOF'
          import os, json, urllib.parse, urllib.request
          def probe(tag, cid, sec, rt):
              print("──", tag, "──")
              if not (cid and sec and rt):
                  print("   ناقص:", bool(cid), bool(sec), bool(rt)); return
              d=urllib.parse.urlencode({"client_id":cid,"client_secret":sec,"refresh_token":rt,"grant_type":"refresh_token"}).encode()
              try:
                  r=json.loads(urllib.request.urlopen(urllib.request.Request("https://oauth2.googleapis.com/token",data=d),timeout=30).read())
                  print("   🟢 حي! صلاحيات:", r.get("scope","")[:130])
                  at=r["access_token"]
                  ch=json.loads(urllib.request.urlopen(urllib.request.Request(
                      "https://www.googleapis.com/youtube/v3/channels?part=snippet,contentDetails&mine=true&maxResults=50",
                      headers={"Authorization":f"Bearer {at}"}),timeout=30).read())
                  print("   عدد القنوات المتاحة للتوكن:", len(ch.get("items",[])))
                  for it in ch.get("items",[]): print("      ·", it["snippet"]["title"], it["id"])
              except urllib.error.HTTPError as e:
                  body=e.read().decode()
                  try: err=json.loads(body).get("error","?"); desc=json.loads(body).get("error_description","")
                  except Exception: err=body[:80]; desc=""
                  print(f"   🔴 {e.code}: {err} | {str(desc)[:110]}")
                  if "invalid_grant" in str(desc)+str(err):
                      print("      معناها: التوكن ميت عند جوجل (مش مشكلة إعدادات من عندك)")
          probe("المشروع الأساسي (نور)", os.environ.get("C1"), os.environ.get("S1"), os.environ.get("R1"))
          probe("مشروع 2 (من daousha)", os.environ.get("C2"), os.environ.get("S2"), os.environ.get("R2"))
          probe("مشروع 3", os.environ.get("C3"), os.environ.get("S3"), os.environ.get("R3"))
          PYEOF
