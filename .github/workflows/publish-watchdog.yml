name: Survival Watchdog — رادار بقاء الفيديوهات
# الدرس (2026-09-19): 9 فيديوهات منشورة اختفت من القناة برسالة يوتيوب
# «This video has been removed by the uploader» — ولم يكن فيه أي إنذار.
# الرادار ده بيفحص كل 20 دقيقة الفيديوهات المنشورة في آخر 6 ساعات:
#   - موجود؟ تمام.
#   - اختفى؟ يفتح بلاغ GitHub فورًا بالتفاصيل + يسجّل الوقت في data/removed_videos.json
# عشان نعرف **إمتى** اختفى كل فيديو — مش نكتشف بعد ساعات.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: daousha-survival-watchdog
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: افحص بقاء أحدث المنشورات (بلا أي توكن — oEmbed عام)
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime, urllib.request, urllib.error

          WINDOW_HOURS = 6
          now = datetime.datetime.now(datetime.timezone.utc)
          records = json.loads(pathlib.Path('data/saved_videos.json').read_text())
          removed_path = pathlib.Path('data/removed_videos.json')
          removed = json.loads(removed_path.read_text()) if removed_path.exists() else []
          known = {r['id'] for r in removed}

          def alive(vid: str) -> bool:
              url = f"https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v={vid}&format=json"
              req = urllib.request.Request(url, headers={'User-Agent': 'daousha-watchdog'})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status == 200
              except urllib.error.HTTPError as e:
                  return e.code in (401, 403)   # خاص/مقيّد = موجود بصلاحية غيره
              except Exception:
                  return True                    # خطأ شبكة → مش دليل اختفاء

          fresh, missing = [], []
          for rec in records:
              stamp = rec.get('publishedAt') or rec.get('verifiedAt')
              if not stamp:
                  continue
              try:
                  at = datetime.datetime.fromisoformat(stamp.replace('Z', '+00:00'))
              except ValueError:
                  continue
              if (now - at).total_seconds() > WINDOW_HOURS * 3600:
                  continue
              fresh.append(rec)
              if not alive(rec['id']):
                  missing.append(rec)

          print(f"فيديوهات آخر {WINDOW_HOURS} ساعات: {len(fresh)} | مش موجودة دلوقتي: {len(missing)}")
          new_missing = [r for r in missing if r['id'] not in known]
          for r in missing:
              print(f"  {'جديد ⚠️' if r['id'] in {x['id'] for x in new_missing} else 'مُسجَّل'} | {r['id']} | {r.get('title','')[:44]}")

          if new_missing:
              for r in new_missing:
                  removed.append({
                      'id': r['id'],
                      'title': r.get('title'),
                      'publishedAt': r.get('publishedAt'),
                      'detectedMissingAt': now.isoformat(),
                  })
              removed_path.write_text(json.dumps(removed, ensure_ascii=False, indent=2))
              lines = [f"- `{r['id']}` — {r.get('title','')} (نُشر {r.get('publishedAt','')})" for r in new_missing]
              pathlib.Path('removed-alert.md').write_text(
                  'اختفى من القناة بعد النشر (يوتيوب بيرجّع 404):\n\n' + '\n'.join(lines) +
                  f"\n\nاتكتشف: {now.isoformat()}\n\nملاحظة: الرسالة من يوتيوب بتكون "
                  "«This video has been removed by the uploader» — يعني الحذف بصلاحيات القناة "
                  "نفسها، مش من المصنع (مفيش أي مسار في الكود بيمسح فيديوهات أثناء النشر).\n")
              print("::warning::فيديو/فيديوهات اختفت — تم تسجيلها وفتح بلاغ")
          else:
              print("✓ كله موجود — مفيش اختفاء جديد")
          PY
      - name: سجّل وبلّغ
        if: hashFiles('removed-alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Daousha Watchdog [Bot]'
          git config user.email 'watchdog@daousha.internal'
          git add data/removed_videos.json
          if ! git diff --staged --quiet; then
            git commit -m 'chore(watchdog): تسجيل فيديوهات اختفت من القناة [skip ci]'
            for attempt in 1 2 3 4 5; do
              git pull --rebase --autostash origin main >/dev/null 2>&1 || true
              if git push origin HEAD:main; then break; fi
              sleep 5
            done
          fi
          title='[alert] فيديو اختفى من القناة بعد النشر'
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file removed-alert.md
          else
            gh issue create --title "$title" --body-file removed-alert.md
          fi
          rm -f removed-alert.md
